# The verification list itself lives in package.json's `verify` script — the
# canonical automated gate. This workflow only provides the environment and
# runs it; do not enumerate individual checks here.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
